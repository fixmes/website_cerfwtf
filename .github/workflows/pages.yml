name: Publish website and introspective

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: introspective/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci
        working-directory: introspective
      - run: npm run build
        working-directory: introspective
        env:
          NEXT_PUBLIC_BASE_PATH: /introspective
      - name: Assemble main website and novel
        run: |
          mkdir -p _site
          rsync -a --exclude='/.git' --exclude='/.github' --exclude='/introspective' --exclude='/_site' ./ _site/
          mkdir -p _site/introspective
          cp -a introspective/out/. _site/introspective/
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/CNAME
          test -f _site/introspective/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
