<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Галерея Карточек</title>
  <style>
      @font-face {
          font-family: "Retron2000";
          src: url("https://cerf.wtf/static/fonts/Retron2000.ttf") format("truetype");
          font-weight: 400;
          font-style: normal;
          font-display: swap;
      }

      :root {
          --bg: #030706;
          --panel: rgba(0, 10, 7, 0.92);
          --panel-soft: rgba(0, 20, 12, 0.78);
          --border: #19ff9c;
          --text: #eafff2;
          --muted: rgba(0, 145, 84, 0.72);
          --accent: #7bff00;
          --accent-2: #baff6f;
          --white: #f4f4f4;
          --cyan: rgba(0, 220, 255, 0.55);
          --red: rgb(255, 0, 85);
          --shadow: rgba(0, 255, 102, 0.28);
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      html { scroll-behavior: smooth; }

      body {
          color: var(--text);
          font-family: "Retron2000", "JetBrains Mono", "Cascadia Code", "Consolas", "Courier New", monospace;
          font-weight: 800;
          letter-spacing: 0;
          min-height: 100vh;
          background:
              radial-gradient(circle at top, rgba(0, 255, 120, 0.09), transparent 32%),
              linear-gradient(rgba(0, 255, 100, 0.045) 1px, transparent 1px),
              linear-gradient(90deg, rgba(0, 255, 100, 0.045) 1px, transparent 1px),
              var(--bg);
          background-size: auto, 18px 18px, 18px 18px, auto;
          overflow-x: hidden;
      }

      body::before {
          content: "01000011 01000001 01010010 01000100 01010011 00100000 01000110 01001001 01001100 01010100 01000101 01010010 00100000 01001101 01001111 01000100 01000101";
          position: fixed;
          inset: 0;
          z-index: 0;
          padding: 12px;
          color: rgba(0, 255, 102, 0.06);
          font-size: 11px;
          line-height: 1.8;
          word-spacing: 10px;
          pointer-events: none;
          overflow: hidden;
      }

      body::after {
          content: "";
          position: fixed;
          inset: 0;
          z-index: 1;
          background: repeating-linear-gradient(
              to bottom,
              rgba(255, 255, 255, 0.025),
              rgba(255, 255, 255, 0.025) 1px,
              transparent 1px,
              transparent 3px
          );
          pointer-events: none;
          mix-blend-mode: screen;
      }

      a { color: inherit; }

      .page {
          position: relative;
          z-index: 2;
          width: min(1400px, calc(100% - 28px));
          margin: 0 auto;
          padding: 28px 0 42px;
      }

      .title {
          margin: 0 0 24px;
          width: 100%;
          text-align: center;
          font-size: clamp(48px, 8vw, 92px);
          line-height: 0.9;
          text-transform: lowercase;
          color: var(--accent);
          text-shadow:
              0 0 8px rgba(100, 255, 106, 0.7),
              0 0 22px rgba(100, 255, 106, 0.35);
      }

      .title::before,
      .title::after {
          color: var(--muted);
      }

      .title::before { content: "["; margin-right: 0.22em; }
      .title::after { content: "]"; margin-left: 0.22em; }

      .filter-bar {
          position: relative;
          margin: 0 auto 30px;
          padding: 22px;
          background: var(--panel);
          border: 1px solid var(--border);
          box-shadow:
              0 0 0 1px rgba(0, 255, 102, 0.08) inset,
              0 0 24px var(--shadow),
              -2px 0 0 rgba(255, 0, 80, 0.35),
              2px 0 0 var(--cyan);
      }

      .filter-bar::before {
          content: "[ filter terminal ]";
          position: absolute;
          top: -12px;
          left: 14px;
          padding: 0 10px;
          background: var(--bg);
          color: var(--text);
          font-size: 10px;
      }

      .filter-row {
          display: grid;
          grid-template-columns: 120px 1fr;
          gap: 14px;
          align-items: start;
          margin-bottom: 14px;
      }

      .filter-row:last-of-type { margin-bottom: 0; }

      .filter-label {
          padding-top: 8px;
          font-size: 0.82rem;
          color: var(--accent-2);
          text-transform: uppercase;
      }

      .filter-group {
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
      }

      .market-btn,
      .reset-btn,
      .sound-btn,
      .character-tag {
          border: 1px solid rgba(25, 255, 156, 0.58);
          border-radius: 0;
          background: rgba(0, 255, 102, 0.07);
          color: var(--text);
          font-family: inherit;
          font-weight: 800;
          letter-spacing: 0;
          cursor: pointer;
          transition: background 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, color 0.18s ease;
      }

      .market-btn,
      .reset-btn,
      .sound-btn {
          min-height: 34px;
          padding: 7px 12px;
          font-size: 0.84rem;
      }

      .market-btn:hover,
      .reset-btn:hover,
      .sound-btn:hover,
      .character-tag:hover {
          border-color: var(--accent);
          background: rgba(123, 255, 0, 0.14);
          box-shadow: 0 0 14px rgba(123, 255, 0, 0.18);
      }

      .market-btn.active {
          color: #071007;
          background: var(--accent);
          border-color: var(--accent);
          box-shadow:
              0 0 14px rgba(123, 255, 0, 0.42),
              -1px 0 0 rgba(255, 0, 80, 0.45),
              1px 0 0 var(--cyan);
      }

      .sound-btn.active {
          color: #071007;
          background: var(--accent-2);
          border-color: var(--accent-2);
          box-shadow: 0 0 14px rgba(186, 255, 111, 0.35);
      }

      .filter-actions {
          display: flex;
          flex-wrap: wrap;
          align-items: center;
          justify-content: space-between;
          gap: 12px;
          margin-top: 16px;
          padding-top: 14px;
          border-top: 1px solid rgba(25, 255, 156, 0.22);
      }

      .filter-count {
          color: var(--muted);
          font-size: 0.82rem;
      }

      .gallery-grid {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
          gap: 24px;
      }

      .card {
          aspect-ratio: 791 / 1087;
          background-color: var(--panel-soft);
          border: 1px solid rgba(25, 255, 156, 0.62);
          overflow: hidden;
          cursor: pointer;
          position: relative;
          box-shadow:
              0 0 0 1px rgba(0, 255, 102, 0.08) inset,
              0 0 20px rgba(0, 255, 102, 0.18);
          transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
      }

      .card::before {
          content: "";
          position: absolute;
          inset: 0;
          z-index: 1;
          background: linear-gradient(90deg, rgba(255, 0, 80, 0.18), transparent 12%, transparent 88%, rgba(0, 220, 255, 0.18));
          opacity: 0;
          pointer-events: none;
          transition: opacity 0.22s ease;
      }

      .card img {
          width: 100%;
          height: 100%;
          object-fit: cover;
          display: block;
          transition: opacity 0.22s ease, filter 0.22s ease;
      }

      .card:hover {
          transform: translateY(-8px);
          border-color: var(--accent);
          box-shadow:
              0 0 0 1px rgba(123, 255, 0, 0.22) inset,
              0 0 26px rgba(123, 255, 0, 0.32),
              -2px 0 0 rgba(255, 0, 80, 0.35),
              2px 0 0 var(--cyan);
      }

      .card:hover::before { opacity: 1; }
      .card:hover img { opacity: 0.94; filter: contrast(1.07) saturate(1.08); }

      .modal {
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          z-index: 1000;
          opacity: 0;
          pointer-events: none;
          transition: opacity 0.28s ease;
      }

      .modal.active { opacity: 1; pointer-events: all; }

      .modal-overlay {
          position: absolute;
          inset: 0;
          background: rgba(0, 0, 0, 0.9);
          backdrop-filter: blur(5px);
      }

      .modal-content {
          position: relative;
          z-index: 10;
          display: flex;
          flex-direction: row;
          width: 85%;
          max-width: 1200px;
          height: 80vh;
          background: var(--panel);
          border: 1px solid var(--border);
          overflow: hidden;
          transform: scale(0.95);
          transition: transform 0.28s ease;
          box-shadow:
              0 0 0 1px rgba(0, 255, 102, 0.08) inset,
              0 0 28px var(--shadow),
              -2px 0 0 rgba(255, 0, 80, 0.35),
              2px 0 0 var(--cyan);
      }

      .modal.active .modal-content { transform: scale(1); }

      .modal-left {
          flex: 1;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 20px;
          perspective: 1200px;
          user-select: none;
          -webkit-user-select: none;
          touch-action: none;
          overflow: hidden;
      }

      .flip-card-inner {
          position: relative;
          width: 100%;
          max-width: 400px;
          aspect-ratio: 791 / 1087;
          transform-style: preserve-3d;
          cursor: grab;
          will-change: transform;
      }

      .flip-card-inner.grabbing { cursor: grabbing; }
      .flip-card-inner.returning { transition: transform 0.6s cubic-bezier(.175,.885,.32,1.1); }

      .flip-card-front,
      .flip-card-back {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          backface-visibility: hidden;
          -webkit-backface-visibility: hidden;
          overflow: hidden;
          border: 1px solid rgba(25, 255, 156, 0.5);
          box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      }

      .flip-card-front img,
      .flip-card-back img {
          width: 100%;
          height: 100%;
          object-fit: contain;
          pointer-events: none;
          display: block;
      }

      .flip-card-back { transform: rotateY(180deg); }

      .swipe-hint {
          position: absolute;
          bottom: 8px;
          left: 50%;
          transform: translateX(-50%);
          font-size: 0.76rem;
          color: var(--muted);
          white-space: nowrap;
          opacity: 0;
          animation: fadeInHint 0.6s 0.5s forwards;
          pointer-events: none;
      }

      @keyframes fadeInHint {
          from { opacity: 0; }
          to   { opacity: 1; }
      }

      .modal-right {
          flex: 1;
          padding: 40px 50px;
          display: flex;
          flex-direction: column;
          justify-content: center;
          overflow-y: auto;
      }

      .modal-right h2 {
          font-size: clamp(2rem, 4vw, 3.4rem);
          line-height: 0.95;
          margin-bottom: 18px;
          color: var(--white);
          text-shadow: 0 0 14px rgba(255, 255, 255, 0.2);
      }

      .modal-right p {
          font-size: 1rem;
          line-height: 1.6;
          color: var(--accent-2);
          margin-bottom: 12px;
      }

      .info-block {
          margin: 14px 0;
          padding: 12px 15px;
          background: rgba(0, 255, 102, 0.055);
          border: 1px solid rgba(25, 255, 156, 0.34);
          border-left: 3px solid var(--border);
      }

      .info-block.limited {
          border-left-color: var(--accent);
          background: rgba(123, 255, 0, 0.08);
      }

      .info-label {
          font-size: 0.76rem;
          color: var(--muted);
          text-transform: uppercase;
          margin-bottom: 6px;
      }

      .info-value {
          font-size: 1rem;
          color: var(--text);
      }

      .characters-list {
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
          margin-top: 8px;
      }

      .character-tag {
          padding: 5px 10px;
          font-size: 0.82rem;
      }

      .character-tag.active {
          color: #071007;
          background: var(--accent);
          border-color: var(--accent);
      }

      .special-edition {
          display: flex;
          align-items: center;
          gap: 8px;
          margin-top: 8px;
      }

      .special-edition a {
          color: var(--accent);
          text-decoration: none;
          transition: color 0.18s ease, text-shadow 0.18s ease;
      }

      .special-edition a:hover {
          color: var(--accent-2);
          text-shadow: 0 0 10px rgba(123, 255, 0, 0.35);
      }

      .nav-btn {
          position: absolute;
          top: 50%;
          transform: translateY(-50%);
          background: var(--panel);
          color: var(--text);
          border: 1px solid rgba(25, 255, 156, 0.62);
          width: 52px;
          height: 52px;
          font-size: 24px;
          cursor: pointer;
          z-index: 20;
          transition: background 0.18s ease, transform 0.18s ease, border-color 0.18s ease;
      }

      .nav-btn:hover {
          background: rgba(123, 255, 0, 0.14);
          border-color: var(--accent);
          transform: translateY(-50%) scale(1.06);
      }

      .prev-btn { left: 20px; }
      .next-btn { right: 20px; }

      .close-btn {
          position: absolute;
          top: 18px;
          right: 24px;
          background: transparent;
          color: var(--text);
          border: none;
          font-size: 36px;
          cursor: pointer;
          z-index: 20;
          transition: color 0.18s ease, text-shadow 0.18s ease;
      }

      .close-btn:hover {
          color: var(--red);
          text-shadow: 0 0 12px rgba(255, 0, 85, 0.5);
      }

      @keyframes slideNext {
          0%   { opacity: 0; transform: translateX(50px); }
          100% { opacity: 1; transform: translateX(0); }
      }
      @keyframes slidePrev {
          0%   { opacity: 0; transform: translateX(-50px); }
          100% { opacity: 1; transform: translateX(0); }
      }

      .anim-next { animation: slideNext 0.4s forwards; }
      .anim-prev { animation: slidePrev 0.4s forwards; }

      .empty-state {
          text-align: center;
          padding: 60px 20px;
          color: var(--muted);
          grid-column: 1 / -1;
          border: 1px solid rgba(25, 255, 156, 0.28);
          background: rgba(0, 255, 102, 0.04);
      }

      @media (max-width: 900px) {
          .page {
              width: min(100% - 20px, 1400px);
              padding: 20px 0 32px;
          }
          .filter-bar { padding: 18px 14px; }
          .filter-row {
              grid-template-columns: 1fr;
              gap: 8px;
          }
          .filter-label { padding-top: 0; }
          .gallery-grid {
              grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
              gap: 15px;
          }
          .modal-content {
              flex-direction: column;
              width: 95%;
              height: 90vh;
              overflow-y: auto;
          }
          .modal-left {
              height: auto;
              min-height: 45vh;
              padding: 15px;
          }
          .flip-card-inner { max-width: 240px; }
          .modal-right {
              height: auto;
              padding: 25px 20px;
              justify-content: flex-start;
          }
          .modal-right h2 { font-size: 2rem; margin-bottom: 12px; }
          .modal-right p  { font-size: 1rem; }
          .nav-btn { width: 42px; height: 42px; font-size: 18px; }
          .prev-btn { left: 10px; }
          .next-btn { right: 10px; }
          .close-btn { top: 10px; right: 15px; font-size: 30px; }
      }
  </style>
</head>

<main class="page">
  <h1 class="title">cards</h1>

  <section class="filter-bar" id="filterBar">
    <div class="filter-row">
      <span class="filter-label">Выпуск</span>
      <div class="filter-group" id="editionFilters"></div>
    </div>
    <div class="filter-row">
      <span class="filter-label">Персонаж</span>
      <div class="filter-group" id="characterFilters"></div>
    </div>
    <div class="filter-actions">
      <div class="filter-group">
        <button class="reset-btn" id="resetFilters" type="button">Сбросить</button>
        <button class="sound-btn active" id="soundToggle" type="button">Звук: вкл</button>
      </div>
      <span class="filter-count" id="filterSummary"></span>
    </div>
  </section>

  <div class="gallery-grid" id="gallery"></div>
</main>

<div class="modal" id="modal">
  <div class="modal-overlay" id="overlay"></div>

  <button class="nav-btn prev-btn" id="prevBtn">&#10094;</button>

  <div class="modal-content" id="modal-content">
    <div class="modal-left" id="modal-left">
      <div class="flip-card-inner" id="flipCard">
        <div class="flip-card-front">
          <img id="modal-img" src="" alt="Front">
        </div>
        <div class="flip-card-back">
          <img id="modal-img-back" src="" alt="Back">
        </div>
      </div>
      <div class="swipe-hint">← Свайпайте для просмотра обратной стороны →</div>
    </div>
    <div class="modal-right">
      <h2 id="modal-title"></h2>
      <p id="modal-desc"></p>

      <div id="card-details"></div>
    </div>
  </div>

  <button class="nav-btn next-btn" id="nextBtn">&#10095;</button>
  <button class="close-btn" id="closeBtn">&times;</button>
</div>

            issueDate: "2024",
            edition: "лимитка",
            characters: ["Айван Рекитт"],
            eventLink: "https://t.me/fixmes/532",
            notes: ""
        },
        {
            image: "cards/zverey_front.png",
            backImage: "cards/zverey_back.png",
            title: "Зверей",
            issueDate: "2026",
            edition: "лимитка",
            characters: ["Нокия Риот"],
            eventLink: "https://vk.com/zvereymarket",
            notes: ""
        },
    ];

    const CARD_ORDERS = {
        all: [
            'ency',
            'rough',
            'vex',
            'zverey',
            'dikiyw',
            'aivan',
            'dean',
            'kiran',
            'ksiva',
            'malina',
            'nokia',
            'ksivasai',
            'ficha',
            'dikiys',
            'daiquiri2024',
            'dean2024',
            'ksiva2024',
            'nokia2024',
            'pavel2024',
            'vanish2024'
        ],
        'обычная': [
            'malina',
            'rough',
            'vex',
            'ksiva',
            'dean',
            'ency',
            'nokia',
            'aivan',
            'kiran'
        ],
        'лимитка': [
            'zverey',
            'dikiys',
            'ksivasai',
            'dikiyw',
            'ficha',
            'daiquiri2024',
            'dean2024',
            'ksiva2024',
            'nokia2024',
            'pavel2024',
            'vanish2024'
        ]
    };

    function getCardId(card) {
        const fileName = card.image.split('/').pop() || '';
        return fileName.replace(/_front\.[^.]+$/, '');
    }

    function compareCards(orderName) {
        const order = CARD_ORDERS[orderName] || CARD_ORDERS.all;
        return (a, b) => {
            const aRank = order.indexOf(getCardId(a));
            const bRank = order.indexOf(getCardId(b));
            const safeARank = aRank === -1 ? Number.MAX_SAFE_INTEGER : aRank;
            const safeBRank = bRank === -1 ? Number.MAX_SAFE_INTEGER : bRank;
            if (safeARank !== safeBRank) return safeARank - safeBRank;

            const yearDiff = Number(b.issueDate || 0) - Number(a.issueDate || 0);
            return yearDiff || a.title.localeCompare(b.title, 'ru');
        };
    }

    function sortCards(cards, orderName) {
        return [...cards].sort(compareCards(orderName));
    }

    cardsData.sort(compareCards('all'));

    cardsData.forEach(c => { if (!c.backImage) c.backImage = c.image; });

    const gallery      = document.getElementById('gallery');
    const modal        = document.getElementById('modal');
    const overlay      = document.getElementById('overlay');
    const closeBtn     = document.getElementById('closeBtn');
    const prevBtn      = document.getElementById('prevBtn');
    const nextBtn      = document.getElementById('nextBtn');
    const modalImg     = document.getElementById('modal-img');
    const modalImgBack = document.getElementById('modal-img-back');
    const modalTitle   = document.getElementById('modal-title');
    const modalDesc    = document.getElementById('modal-desc');
    const modalContent = document.getElementById('modal-content');
    const flipCard     = document.getElementById('flipCard');
    const modalLeft    = document.getElementById('modal-left');
    const filterBar    = document.getElementById('filterBar');
    const editionFilters = document.getElementById('editionFilters');
    const characterFilters = document.getElementById('characterFilters');
    const resetFilters = document.getElementById('resetFilters');
    const soundToggle = document.getElementById('soundToggle');
    const filterSummary = document.getElementById('filterSummary');
    const cardDetails  = document.getElementById('card-details');

    const EDITION_FILTER_ORDER = ['обычная', 'лимитка'];
    const EDITION_LABELS = {
        all: 'Все',
        'обычная': 'Обычная',
        'лимитка': 'Лимитированная'
    };

    let currentIndex = 0;
    let currentEditionFilter = 'all';
    let currentCharacterFilter = 'all';
    let filteredCards = [...cardsData];
    let soundEnabled = true;
    let audioCtx = null;

    const soundMap = {
        open: [196, 392, 588],
        close: [392, 247],
        filter: [660, 880],
        character: [740, 987],
        nav: [523, 659],
        reset: [220, 165],
        toggle: [880, 1174]
    };

    function getAudioContext() {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return null;
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
    }

    function playUiSound(type) {
        if (!soundEnabled) return;
        const ctx = getAudioContext();
        if (!ctx) return;

        const notes = soundMap[type] || soundMap.filter;
        const startAt = ctx.currentTime + 0.01;
        notes.forEach((frequency, index) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const noteStart = startAt + index * 0.045;
            const noteEnd = noteStart + 0.085;

            osc.type = index % 2 === 0 ? 'square' : 'triangle';
            osc.frequency.setValueAtTime(frequency, noteStart);
            osc.frequency.exponentialRampToValueAtTime(frequency * 1.015, noteEnd);
            gain.gain.setValueAtTime(0.0001, noteStart);
            gain.gain.exponentialRampToValueAtTime(0.035, noteStart + 0.012);
            gain.gain.exponentialRampToValueAtTime(0.0001, noteEnd);

            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(noteStart);
            osc.stop(noteEnd + 0.02);
        });
    }

    function updateSoundToggle() {
        soundToggle.textContent = `Звук: ${soundEnabled ? 'вкл' : 'выкл'}`;
        soundToggle.classList.toggle('active', soundEnabled);
    }

    function getUniqueEditions() {
        const editions = new Set();
        cardsData.forEach(card => {
            if (card.edition) editions.add(card.edition);
        });
        return EDITION_FILTER_ORDER.filter(edition => editions.has(edition));
    }

    function getUniqueCharacters() {
        const characters = new Set();
        cardsData.forEach(card => {
            (card.characters || []).forEach(char => characters.add(char));
        });
        return Array.from(characters).sort();
    }

    function renderFilterGroup(container, values, activeValue, dataKey, onClick, labels = {}) {
        container.innerHTML = '';

        const allBtn = document.createElement('button');
        allBtn.className = `market-btn all ${activeValue === 'all' ? 'active' : ''}`;
        allBtn.type = 'button';
        allBtn.textContent = labels.all || 'Все';
        allBtn.dataset[dataKey] = 'all';
        allBtn.addEventListener('click', () => onClick('all'));
        container.appendChild(allBtn);

        values.forEach(value => {
            const btn = document.createElement('button');
            btn.className = `market-btn ${activeValue === value ? 'active' : ''}`;
            btn.type = 'button';
            btn.textContent = labels[value] || value;
            btn.dataset[dataKey] = value;
            btn.addEventListener('click', () => onClick(value));
            container.appendChild(btn);
        });
    }

    function renderFilters() {
        const editions = getUniqueEditions();
        const characters = getUniqueCharacters();
        filterBar.hidden = editions.length === 0 && characters.length === 0;
        if (filterBar.hidden) return;

        renderFilterGroup(editionFilters, editions, currentEditionFilter, 'edition', applyEditionFilter, EDITION_LABELS);
        renderFilterGroup(characterFilters, characters, currentCharacterFilter, 'character', applyCharacterFilter);
    }

    function applyEditionFilter(edition) {
        playUiSound('filter');
        currentEditionFilter = edition;
        applyFilters();
    }

    function applyCharacterFilter(character) {
        playUiSound('character');
        currentCharacterFilter = character;
        applyFilters();
    }

    function resetAllFilters() {
        playUiSound('reset');
        currentEditionFilter = 'all';
        currentCharacterFilter = 'all';
        applyFilters();
    }

    function toggleSound() {
        soundEnabled = !soundEnabled;
        updateSoundToggle();
        if (soundEnabled) playUiSound('toggle');
    }

    function applyFilters() {
        const orderName = currentEditionFilter === 'all' ? 'all' : currentEditionFilter;
        filteredCards = sortCards(cardsData.filter(card => {
            const matchesEdition = currentEditionFilter === 'all' || card.edition === currentEditionFilter;
            const matchesCharacter = currentCharacterFilter === 'all' || (card.characters || []).includes(currentCharacterFilter);
            return matchesEdition && matchesCharacter;
        }), orderName);

        renderFilters();
        renderGallery();
        updateFilterSummary();

        if (modal.classList.contains('active') && filteredCards.length > 0) {
            const currentCard = cardsData[currentIndex];
            const isInFilter = filteredCards.includes(currentCard);
            if (!isInFilter) {
                currentIndex = cardsData.indexOf(filteredCards[0]);
                updateModalContent();
            }
        } else if (modal.classList.contains('active') && filteredCards.length === 0) {
            closeModal();
        }
    }

    function updateFilterSummary() {
        const parts = [];
        if (currentEditionFilter !== 'all') parts.push(EDITION_LABELS[currentEditionFilter] || currentEditionFilter);
        if (currentCharacterFilter !== 'all') parts.push(currentCharacterFilter);

        const filterText = parts.length > 0 ? ` / ${parts.join(' / ')}` : '';
        filterSummary.textContent = `${filteredCards.length} из ${cardsData.length}${filterText}`;
    }

    function renderGallery() {
        gallery.innerHTML = '';

        if (filteredCards.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'empty-state';
            empty.textContent = 'ничего не найдено';
            gallery.appendChild(empty);
            return;
        }

        filteredCards.forEach((card) => {
            const originalIndex = cardsData.indexOf(card);
            const el = document.createElement('div');
            el.classList.add('card');
            el.innerHTML = `<img src="${card.image}" alt="${card.title}" loading="lazy">`;
            el.addEventListener('click', () => openModal(originalIndex));
            gallery.appendChild(el);
        });
    }

    function escapeHtml(value) {
        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function formatCardDetails(card) {
        let html = '';

        if (card.issueDate) {
            html += `
                <div class="info-block">
                    <div class="info-label">Год издания</div>
                    <div class="info-value">${escapeHtml(card.issueDate)}</div>
                </div>
            `;
        }

        if (card.edition) {
            const isLimited = card.edition.toLowerCase() === 'лимитка';
            const eventLink = isLimited && card.eventLink
                ? `<div class="special-edition"><a href="${escapeHtml(card.eventLink)}" target="_blank" rel="noopener">Ссылка на ивент</a></div>`
                : '';

            html += `
                <div class="info-block ${isLimited ? 'limited' : ''}">
                    <div class="info-label">Тип выпуска</div>
                    <div class="info-value">${isLimited ? 'Лимитка' : 'Обычная'}</div>
                    ${eventLink}
                </div>
            `;
        }

        if (card.characters && card.characters.length > 0) {
            html += `
                <div class="info-block">
                    <div class="info-label">Персонажи</div>
                    <div class="characters-list">
                        ${card.characters.map(char => `
                            <button class="character-tag ${currentCharacterFilter === char ? 'active' : ''}" type="button" data-character="${escapeHtml(char)}">
                                ${escapeHtml(char)}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        if (card.notes) {
            html += `
                <div class="info-block">
                    <div class="info-label">Заметки</div>
                    <div class="info-value">${escapeHtml(card.notes)}</div>
                </div>
            `;
        }

        return html;
    }

    function openModal(index) {
        playUiSound('open');
        currentIndex = index;
        updateModalContent();
        modal.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeModal() {
        playUiSound('close');
        modal.classList.remove('active');
        document.body.style.overflow = '';
        resetCard();
    }

    function updateModalContent(animClass = '') {
        const data = cardsData[currentIndex];

        modalContent.classList.remove('anim-next', 'anim-prev');
        void modalContent.offsetWidth;
        if (animClass) modalContent.classList.add(animClass);

        modalImg.src     = data.image;
        modalImgBack.src = data.backImage;
        modalTitle.textContent = data.title;
        modalDesc.textContent = data.notes || '';
        modalDesc.hidden = !data.notes;

        cardDetails.innerHTML = formatCardDetails(data);

        resetCard();
    }

    cardDetails.addEventListener('click', e => {
        const tag = e.target.closest('[data-character]');
        if (!tag) return;
        applyCharacterFilter(tag.dataset.character);
        closeModal();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    function showNext() {
        playUiSound('nav');
        const currentFilteredIndex = filteredCards.indexOf(cardsData[currentIndex]);
        const nextFilteredCard = filteredCards[(currentFilteredIndex + 1) % filteredCards.length];
        currentIndex = cardsData.indexOf(nextFilteredCard);
        updateModalContent('anim-next');
    }

    function showPrev() {
        playUiSound('nav');
        const currentFilteredIndex = filteredCards.indexOf(cardsData[currentIndex]);
        const prevFilteredCard = filteredCards[(currentFilteredIndex - 1 + filteredCards.length) % filteredCards.length];
        currentIndex = cardsData.indexOf(prevFilteredCard);
        updateModalContent('anim-prev');
    }

    closeBtn.addEventListener('click', closeModal);
    overlay.addEventListener('click', closeModal);
    nextBtn.addEventListener('click', showNext);
    prevBtn.addEventListener('click', showPrev);
    resetFilters.addEventListener('click', resetAllFilters);
    soundToggle.addEventListener('click', toggleSound);

    document.addEventListener('keydown', e => {
        if (!modal.classList.contains('active')) return;
        if (e.key === 'Escape')     closeModal();
        if (e.key === 'ArrowRight') showNext();
        if (e.key === 'ArrowLeft')  showPrev();
    });

    const ROTATION_FACTOR = 0.45;
    const MAX_ROTATE_X   = 35;
    const MAX_ROTATE_Y   = 180;
    const FRICTION        = 0.92;
    const VELOCITY_CUTOFF = 0.25;

    let dragging  = false;
    let startX = 0, startY = 0;
    let velX = 0, velY = 0;
    let lastPtX = 0, lastPtY = 0;
    let lastTime = 0;
    let rafId = null;
    let state = { rx: 0, ry: 0 };

    function resetCard() {
        if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
        flipCard.classList.remove('returning', 'grabbing');
        flipCard.style.transform = '';
        state = { rx: 0, ry: 0 };
        velX = 0;
        velY = 0;
    }

    function setTransform(rx, ry) {
        flipCard.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
    }

    function onDown(e) {
        if (e.target.closest('.nav-btn, .close-btn')) return;
        e.preventDefault();
        dragging = true;
        flipCard.classList.add('grabbing');
        flipCard.classList.remove('returning');
        if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
        const pt = e.touches ? e.touches[0] : e;
        startX   = pt.clientX;
        startY   = pt.clientY;
        lastPtX  = pt.clientX;
        lastPtY  = pt.clientY;
        lastTime = performance.now();
        velX = 0;
        velY = 0;
    }

    function onMove(e) {
        if (!dragging) return;
        e.preventDefault();
        const pt = e.touches ? e.touches[0] : e;
        const now = performance.now();
        const dt  = Math.max(now - lastTime, 1);
        const dx = pt.clientX - startX;
        const dy = pt.clientY - startY;
        const ddx = pt.clientX - lastPtX;
        const ddy = pt.clientY - lastPtY;
        velX = (ddx / dt) * ROTATION_FACTOR * 16;
        velY = (ddy / dt) * ROTATION_FACTOR * 16;
        state.ry = dx * ROTATION_FACTOR;
        state.rx = -dy * ROTATION_FACTOR;
        state.rx = Math.max(-MAX_ROTATE_X, Math.min(MAX_ROTATE_X, state.rx));
        state.ry = Math.max(-MAX_ROTATE_Y, Math.min(MAX_ROTATE_Y, state.ry));
        setTransform(state.rx, state.ry);
        lastPtX  = pt.clientX;
        lastPtY  = pt.clientY;
        lastTime = now;
    }

    function onUp() {
        if (!dragging) return;
        dragging = false;
        flipCard.classList.remove('grabbing');
        rafId = requestAnimationFrame(inertiaLoop);
    }

    function inertiaLoop() {
        velX *= FRICTION;
        velY *= FRICTION;
        state.ry += velX;
        state.rx -= velY;
        const speed = Math.sqrt(velX * velX + velY * velY);
        if (speed < VELOCITY_CUTOFF) {
            flipCard.classList.add('returning');
            state = { rx: 0, ry: 0 };
            setTransform(0, 0);
            return;
        }
        state.rx = Math.max(-MAX_ROTATE_X * 1.5, Math.min(MAX_ROTATE_X * 1.5, state.rx));
        state.ry = Math.max(-MAX_ROTATE_Y, Math.min(MAX_ROTATE_Y, state.ry));
        setTransform(state.rx, state.ry);
        rafId = requestAnimationFrame(inertiaLoop);
    }

    modalLeft.addEventListener('mousedown',  onDown);
    document.addEventListener('mousemove',   onMove);
    document.addEventListener('mouseup',     onUp);
    modalLeft.addEventListener('touchstart', onDown, { passive: false });
    modalLeft.addEventListener('touchmove',  onMove, { passive: false });
    modalLeft.addEventListener('touchend',   onUp);

    function init() {
        updateSoundToggle();
        renderFilters();
        renderGallery();
        updateFilterSummary();
    }

    init();
</script>
</body>
</html>
